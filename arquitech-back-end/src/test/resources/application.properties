spring.datasource.url=jdbc:h2:mem:arquitech;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.acme.arquitech.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jackson.deserialization.fail-on-unknown-properties=true
authorization.jwt.secret=ArquiTechIntegrationTestSecretAtLeastThirtyTwoBytesLong
authorization.jwt.expiration.days=7
cors.allowed-origins=http://localhost:4200
documentation.application.version=test
logging.level.root=WARN
logging.level.org.hibernate.SQL=OFF
