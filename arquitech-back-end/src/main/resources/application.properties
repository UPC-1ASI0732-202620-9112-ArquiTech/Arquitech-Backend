spring.application.name=arquitech-back-end

# Railway accepts a JDBC MySQL URL, username and password through environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/arquitechbackend?serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.acme.arquitech.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Reject protected/unknown properties instead of silently accepting profile or stock mutations.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

documentation.application.version=@project.version@
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
