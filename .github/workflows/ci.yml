name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: arquitech-back-end

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: arquitech-back-end/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Verify
        run: ./mvnw clean verify
