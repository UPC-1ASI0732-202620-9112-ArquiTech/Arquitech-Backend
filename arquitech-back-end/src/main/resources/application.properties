# Spring Application Name
spring.application.name=arquitech-back-end

# ==========================================================
# DataSource Configuration
# Los valores se toman de variables de entorno.
# El valor despues de los dos puntos es el fallback LOCAL.
# NUNCA escribir credenciales de produccion en este archivo.
# ==========================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/arquitechbackend?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true&publicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:password}

# Spring Data JPA Configuration
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.hibernate.naming.physical-strategy=com.acme.arquitech.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native

# ==========================================================
# JWT Configuration
# El valor por defecto es SOLO para desarrollo local.
# En produccion se define la variable JWT_SECRET en la plataforma.
# ==========================================================
authorization.jwt.secret=${JWT_SECRET:LocalDevelopmentOnlySecretDoNotUseInProduction}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
