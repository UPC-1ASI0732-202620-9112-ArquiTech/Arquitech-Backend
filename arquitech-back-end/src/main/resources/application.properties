spring.application.name=arquitech-back-end

# ==========================================================
# MySQL
# ==========================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/arquitechbackend?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=root
spring.datasource.password=@Upc$ql2025#

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.hibernate.naming.physical-strategy=com.acme.arquitech.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# ==========================================================
# JSON
# ==========================================================
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ==========================================================
# Documentation
# ==========================================================
documentation.application.version=@project.version@

# ==========================================================
# Server
# ==========================================================
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=native

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================================================
# JWT
# ==========================================================
authorization.jwt.secret=${JWT_SECRET:ArquiTechLocalDevelopmentSecretKey2026ChangeMePlease123456}
authorization.jwt.expiration.days=7

# ==========================================================
# CORS
# ==========================================================
cors.allowed-origins=http://localhost:4200